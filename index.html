<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CNC-Hub | UK CNC Manufacturing Exchange</title>

<style>

:root {
    --navy:#0b1220;
    --navy2:#111827;
    --orange:#f59e0b;
    --orange2:#fbbf24;
    --bg:#f5f7fa;
    --white:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;
    --green:#16a34a;
    --blue:#2563eb;
    --red:#dc2626;
    --shadow:0 8px 30px rgba(15,23,42,.07);
}

* {
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

body {
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
}

button,
input,
select,
textarea {
    font-family:inherit;
}

button {
    cursor:pointer;
}

/* =====================================================
   NAVIGATION
===================================================== */

nav {
    height:74px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo {
    font-size:25px;
    font-weight:900;
    letter-spacing:-1.5px;
    cursor:pointer;
}

.logo span {
    color:var(--orange);
}

.nav-links {
    display:flex;
    align-items:center;
    gap:24px;
}

.nav-links a {
    text-decoration:none;
    color:#334155;
    font-size:14px;
    font-weight:700;
}

.nav-actions {
    display:flex;
    align-items:center;
    gap:10px;
}

.mobile-menu {
    display:none;
    border:0;
    background:none;
    font-size:26px;
}

/* =====================================================
   BUTTONS
===================================================== */

.btn {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:12px 19px;
    border-radius:7px;
    text-decoration:none;
    font-weight:800;
    border:1px solid transparent;
    cursor:pointer;
    transition:.2s;
}

.btn:hover {
    transform:translateY(-1px);
}

.btn-primary {
    background:var(--orange);
    color:#111827;
}

.btn-primary:hover {
    background:var(--orange2);
}

.btn-dark {
    background:var(--navy);
    color:white;
}

.btn-outline {
    background:white;
    border-color:#cbd5e1;
    color:#0f172a;
}

.btn-small {
    padding:8px 13px;
    font-size:13px;
}

.btn-danger {
    background:#fee2e2;
    color:#991b1b;
}

/* =====================================================
   HERO
===================================================== */

.hero {
    background:var(--navy);
    color:white;
    padding:90px 5% 95px;
    position:relative;
    overflow:hidden;
}

.hero-content {
    max-width:1180px;
    margin:auto;
    position:relative;
    z-index:2;
}

.kicker {
    color:var(--orange);
    text-transform:uppercase;
    letter-spacing:2px;
    font-weight:900;
    font-size:13px;
}

.hero h1 {
    font-size:clamp(45px,6vw,76px);
    line-height:.98;
    letter-spacing:-4px;
    max-width:850px;
    margin:18px 0 25px;
}

.hero p {
    max-width:720px;
    font-size:20px;
    color:#cbd5e1;
}

.hero-buttons {
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:32px;
}

.hero-stats {
    display:grid;
    grid-template-columns:repeat(3,180px);
    gap:15px;
    margin-top:60px;
}

.hero-stat {
    border-left:2px solid var(--orange);
    padding-left:15px;
}

.hero-stat strong {
    display:block;
    font-size:27px;
}

.hero-stat span {
    color:#94a3b8;
    font-size:13px;
}

.hero-circle {
    position:absolute;
    width:600px;
    height:600px;
    border:1px solid #334155;
    border-radius:50%;
    right:-240px;
    top:-170px;
}

.hero-circle:before {
    content:"";
    position:absolute;
    width:410px;
    height:410px;
    border:1px solid #334155;
    border-radius:50%;
    left:95px;
    top:95px;
}

/* =====================================================
   SECTIONS
===================================================== */

.section {
    max-width:1180px;
    margin:auto;
    padding:80px 5%;
}

.band {
    background:white;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
}

.section-title {
    max-width:720px;
}

.section h2 {
    font-size:40px;
    line-height:1.1;
    letter-spacing:-1.5px;
    margin:0 0 10px;
}

.lead {
    color:var(--muted);
    font-size:18px;
}

/* =====================================================
   CARDS
===================================================== */

.grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:35px;
}

.card {
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:25px;
    box-shadow:var(--shadow);
}

.card h3 {
    margin-top:0;
}

.card p {
    color:var(--muted);
}

.icon {
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    background:#fff7e6;
    color:#a16207;
    border-radius:10px;
    font-size:22px;
    margin-bottom:15px;
}

/* =====================================================
   MARKETPLACE PREVIEW
===================================================== */

.job-list {
    margin-top:30px;
    display:grid;
    gap:14px;
}

.job-card {
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:center;
    box-shadow:0 4px 15px rgba(15,23,42,.04);
}

.job-main h3 {
    margin:0 0 5px;
}

.job-meta {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.tag {
    background:#eef2f7;
    color:#475569;
    border-radius:20px;
    padding:5px 10px;
    font-size:12px;
    font-weight:700;
}

.tag.orange {
    background:#fff4d6;
    color:#92400e;
}

.tag.green {
    background:#dcfce7;
    color:#166534;
}

.job-right {
    text-align:right;
    min-width:150px;
}

.job-right strong {
    display:block;
    font-size:18px;
}

.job-right span {
    color:var(--muted);
    font-size:13px;
}

/* =====================================================
   PORTAL
===================================================== */

.portal {
    display:none;
    min-height:calc(100vh - 74px);
    background:#f1f5f9;
}

.portal.active {
    display:block;
}

.portal-header {
    background:white;
    border-bottom:1px solid var(--border);
    padding:20px 4%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.portal-header h1 {
    margin:0;
    font-size:25px;
}

.user-chip {
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar {
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--navy);
    color:white;
    display:grid;
    place-items:center;
    font-weight:900;
}

.portal-layout {
    display:grid;
    grid-template-columns:235px 1fr;
    min-height:calc(100vh - 145px);
}

.sidebar {
    background:var(--navy);
    color:white;
    padding:25px 15px;
}

.sidebar-title {
    color:#64748b;
    text-transform:uppercase;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
    padding:10px 12px;
}

.sidebar button {
    width:100%;
    text-align:left;
    background:transparent;
    border:0;
    color:#cbd5e1;
    padding:12px;
    border-radius:7px;
    font-weight:700;
    margin-bottom:3px;
}

.sidebar button:hover,
.sidebar button.active {
    background:#1e293b;
    color:white;
}

.sidebar .orange {
    background:var(--orange);
    color:#111827;
    margin-bottom:20px;
}

.portal-content {
    padding:30px;
    max-width:1400px;
    width:100%;
}

/* =====================================================
   DASHBOARD
===================================================== */

.dashboard-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin:20px 0 30px;
}

.stat-card {
    background:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
}

.stat-card span {
    display:block;
    color:var(--muted);
    font-size:13px;
}

.stat-card strong {
    font-size:30px;
    display:block;
    margin-top:5px;
}

.dashboard-two {
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.portal-card {
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    margin-bottom:20px;
}

.portal-card h2 {
    margin-top:0;
    font-size:20px;
}

.table {
    width:100%;
    border-collapse:collapse;
}

.table th {
    color:#64748b;
    font-size:12px;
    text-transform:uppercase;
    text-align:left;
    padding:12px;
    border-bottom:1px solid var(--border);
}

.table td {
    padding:15px 12px;
    border-bottom:1px solid var(--border);
    font-size:14px;
}

.status {
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.status.green {
    background:#dcfce7;
    color:#166534;
}

.status.orange {
    background:#fef3c7;
    color:#92400e;
}

.status.blue {
    background:#dbeafe;
    color:#1e40af;
}

.status.grey {
    background:#e2e8f0;
    color:#475569;
}

/* =====================================================
   FORMS
===================================================== */

.form-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group {
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full {
    grid-column:1/-1;
}

.form-group label {
    font-size:13px;
    font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea {
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    background:white;
    outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color:var(--orange);
}

.file-upload {
    border:2px dashed #cbd5e1;
    padding:25px;
    text-align:center;
    border-radius:10px;
    background:#f8fafc;
}

/* =====================================================
   LOGIN
===================================================== */

.login-overlay {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(2,6,23,.72);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-overlay.active {
    display:flex;
}

.login-box {
    background:white;
    width:100%;
    max-width:430px;
    border-radius:15px;
    padding:35px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.login-box h2 {
    margin-top:0;
}

.login-tabs {
    display:grid;
    grid-template-columns:1fr 1fr;
    margin:20px 0;
    background:#f1f5f9;
    border-radius:7px;
    padding:4px;
}

.login-tabs button {
    border:0;
    background:transparent;
    padding:10px;
    border-radius:5px;
    font-weight:800;
}

.login-tabs button.active {
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.demo-note {
    background:#fff7e6;
    border:1px solid #fde68a;
    padding:12px;
    border-radius:7px;
    font-size:13px;
    margin-top:15px;
}

.close-login {
    float:right;
    border:0;
    background:none;
    font-size:22px;
}

/* =====================================================
   PROFILE
===================================================== */

.profile-header {
    background:var(--navy);
    color:white;
    border-radius:12px;
    padding:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.profile-name {
    display:flex;
    align-items:center;
    gap:20px;
}

.profile-large-avatar {
    width:70px;
    height:70px;
    border-radius:12px;
    background:var(--orange);
    color:#111827;
    display:grid;
    place-items:center;
    font-size:26px;
    font-weight:900;
}

/* =====================================================
   MODAL
===================================================== */

.modal {
    display:none;
    position:fixed;
    inset:0;
    z-index:2500;
    background:rgba(2,6,23,.65);
    padding:20px;
    overflow:auto;
}

.modal.active {
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.modal-box {
    background:white;
    max-width:750px;
    width:100%;
    margin:50px auto;
    border-radius:14px;
    padding:30px;
}

.modal-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-close {
    border:0;
    background:none;
    font-size:25px;
}

/* =====================================================
   TOAST
===================================================== */

.toast {
    position:fixed;
    right:25px;
    bottom:25px;
    background:var(--navy);
    color:white;
    padding:15px 20px;
    border-radius:8px;
    box-shadow:var(--shadow);
    display:none;
    z-index:5000;
}

.toast.show {
    display:block;
}

/* =====================================================
   FOOTER
===================================================== */

footer {
    background:#070c15;
    color:#cbd5e1;
    padding:45px 5%;
}

.footer-content {
    max-width:1180px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    gap:30px;
    flex-wrap:wrap;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px) {

    .nav-links {
        display:none;
    }

    .mobile-menu {
        display:block;
    }

    .hero h1 {
        font-size:52px;
        letter-spacing:-2px;
    }

    .hero-stats {
        grid-template-columns:1fr 1fr;
    }

    .grid {
        grid-template-columns:1fr;
    }

    .dashboard-grid {
        grid-template-columns:1fr 1fr;
    }

    .dashboard-two {
        grid-template-columns:1fr;
    }

    .portal-layout {
        grid-template-columns:1fr;
    }

    .sidebar {
        display:none;
    }

    .form-grid {
        grid-template-columns:1fr;
    }

    .job-card {
        flex-direction:column;
        align-items:flex-start;
    }

    .job-right {
        text-align:left;
    }

}
